version: "3.8"

services:
  postgres:
    build: ./postgres # Construye la imagen desde la carpeta 'postgres'
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Monta el script SQL para crear el esquema de la base de datos
      - ./backend/src/infrastructure/database/migrations/001-initial-schema.sql:/docker-entrypoint-initdb.d/02-initial-schema.sql
    ports:
      # Expone el puerto 3306 del contenedor al puerto especificado en el host.
      # IMPORTANTE: "127.0.0.1" restringe el acceso a este puerto solo desde el propio servidor.
      - "127.0.0.1:${DB_PORT_EXTERNAL}:5432"
    networks:
      - portfolio_network
    healthcheck:
      # Comprueba si el servidor de PostgreSQL está listo para aceptar conexiones.
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build: ./redis
    container_name: redis_cache
    restart: unless-stopped
    env_file: .env # Añadir para que la variable de entorno esté disponible para el comando de sustitución
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: >
      sh -c "envsubst < /usr/local/etc/redis/redis.conf > /tmp/redis.conf && redis-server /tmp/redis.conf"
    networks:
      - portfolio_network
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3000
    networks:
      - portfolio_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: frontend_app
    restart: unless-stopped
    networks:
      - portfolio_network
    depends_on:
      - backend
    # Nginx no tiene un healthcheck simple por defecto, pero se puede añadir un endpoint en Nginx si es necesario.

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: db_backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Europe/Madrid # Zona horaria (opcional)
    volumes:
      - backups_data:/backup
    networks:
      - portfolio_network
    # Añadir un init system para gestionar correctamente los procesos (como cron)
    # y evitar errores de permisos como "setpgid: Operation not permitted".
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  backups_data:
    driver: local
  redis_data:
    driver: local

networks:
  portfolio_network:
    driver: bridge
