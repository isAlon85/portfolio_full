server {
    listen 80;
    server_name localhost;

    # Oculta la versión de Nginx en las cabeceras de respuesta.
    server_tokens off;

    # Raíz del servidor y archivo de índice principal.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Intenta servir el archivo solicitado directamente, luego como un directorio,
        # y si no lo encuentra, redirige a /index.html para el enrutamiento del lado del cliente.
        try_files $uri $uri/ /index.html;
    }

    # Añade cabeceras de seguridad para protección adicional.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self';" always;
}